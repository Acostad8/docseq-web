<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DocSeq — Numeración automática de ilustraciones y tablas en documentos Word mediante campos SEQ">
  <meta name="theme-color" content="#0a0a14">
  <title>DocSeq — Numeración automática para Word</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    try {
      var t = localStorage.getItem('docseq-theme');
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</head>
<body>
  <div id="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div id="app">
    <header>
      <h1>DocSeq <span class="version" title="Versión de DocSeq">v1.1.0</span></h1>
      <p class="subtitle">Numeración de ilustraciones y tablas mediante campos SEQ</p>
      <button class="theme-toggle" id="theme-toggle" type="button" role="switch" aria-label="Cambiar tema claro/oscuro" aria-checked="true" title="Cambiar tema">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
          <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
          <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
          <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>
        </svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </header>

    <main>
      <section class="card" id="file-card" aria-label="Selección de documento">
        <h2>Documento</h2>
        <div class="upload-area" id="dropzone" role="button" tabindex="0" aria-label="Subir archivo .docx">
          <div class="upload-icon">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="12" y1="18" x2="12" y2="12"/>
              <line x1="9" y1="15" x2="12" y2="12"/>
              <line x1="15" y1="15" x2="12" y2="12"/>
            </svg>
          </div>
          <p class="upload-text">Arrastra un archivo .docx aquí o <a href="#" id="browse-link" role="button">examina</a></p>
          <p class="upload-hint">Solo documentos Word (.docx)</p>
          <input type="file" id="file-input" accept=".docx" hidden>
        </div>
        <div class="file-info" id="file-info" hidden>
          <span class="file-name" id="file-name"></span>
          <button class="btn-text" id="change-file">Cambiar</button>
        </div>
      </section>

      <section class="card" id="actions-card" aria-label="Acciones de procesamiento">
        <h2>Acciones</h2>
        <div class="actions-grid">
          <button class="btn btn-action" data-action="numerar" disabled aria-label="Paso 1: Numerar">
            <span class="btn-num">1</span> Numerar
          </button>
          <button class="btn btn-action" data-action="insertar_seq" disabled aria-label="Paso 2: Insertar SEQ">
            <span class="btn-num">2</span> Insertar SEQ
          </button>
          <button class="btn btn-action btn-secondary" data-action="renumerar" disabled>
            Renumerar
          </button>
          <button class="btn btn-action btn-secondary" data-action="verificar" disabled>
            Verificar
          </button>
        </div>
        <div class="separator"></div>
        <button class="btn btn-primary" id="btn-todo" data-action="todo" disabled>
          Procesar todo <span class="arrow">→</span>
        </button>
      </section>

      <div class="progress-track" id="progress-track" aria-hidden="true">
        <div class="step-node" data-step="1">
          <div class="step-circle"><span>1</span></div>
          <span class="step-label">Numerar</span>
        </div>
        <div class="step-line" data-from="1"></div>
        <div class="step-node" data-step="2">
          <div class="step-circle"><span>2</span></div>
          <span class="step-label">Insertar SEQ</span>
        </div>
        <div class="step-line" data-from="2"></div>
        <div class="step-node" data-step="3">
          <div class="step-circle"><span>3</span></div>
          <span class="step-label">Descargar</span>
        </div>
      </div>

      <section class="card" id="results-card" aria-label="Resultados y registro">
        <div class="results-header">
          <h2>Resultados</h2>
          <button class="btn-text btn-clear" id="btn-clear" hidden>Limpiar</button>
        </div>
        <div class="log-container" id="log" role="log" aria-live="polite">
          <div class="log-empty">Sube un archivo .docx para comenzar.</div>
        </div>
      </section>
    </main>

    <footer>
      <div class="status" id="status">
        <span class="status-dot" id="status-dot" aria-hidden="true"></span>
        <span class="status-text" id="status-text">Listo</span>
      </div>
      <div class="spinner" id="spinner" hidden aria-hidden="true">
        <div class="bar"></div>
      </div>
      <span class="step-indicator" id="step-indicator" hidden aria-live="polite"></span>
      <button class="btn btn-secondary btn-sm" id="btn-download" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:2px">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Descargar
      </button>
    </footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
